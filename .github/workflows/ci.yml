name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned dependency manager
        run: python -m pip install "uv==0.11.28"

      - name: Dependency lock synchronization
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Generate synthetic CI environment
        shell: bash
        run: |
          SESSION_SECRET="$(uv run --locked python -m app.cli generate-session-secret)"
          WORKER_AUTH_PASSWORD="$(uv run --locked python -m app.cli generate-worker-auth-password)"
          BOOTSTRAP_WORKER_SECRET="$(uv run --locked python -m app.cli generate-bootstrap-worker-secret)"
          MASTER_KEY="$(uv run --locked python -m app.cli generate-master-key)"
          ADMIN_HASH="$(uv run --locked python -c 'from app.core.security import hash_password; print(hash_password("ci-only-password"))')"
          printf '%s' "$BOOTSTRAP_WORKER_SECRET" > .bootstrap-worker-secret.ci
          chmod 0600 .bootstrap-worker-secret.ci
          sudo chown 10001:10001 .bootstrap-worker-secret.ci
          test "$(stat -c '%a:%u:%g' .bootstrap-worker-secret.ci)" = '600:10001:10001'
          {
            echo 'RTMP_BIND_ADDRESS=127.0.0.1'
            echo 'ADMIN_LOGIN=ci-admin'
            echo 'TRUSTED_PROXIES=127.0.0.1,::1'
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'WORKER_AUTH_PASSWORD=%s\n' "$WORKER_AUTH_PASSWORD"
            printf 'BOOTSTRAP_WORKER_SECRET=%s\n' "$BOOTSTRAP_WORKER_SECRET"
            echo 'BOOTSTRAP_WORKER_SECRET_FILE=.bootstrap-worker-secret.ci'
            printf 'MASTER_ENCRYPTION_KEY=%s\n' "$MASTER_KEY"
            printf "ADMIN_PASSWORD_HASH='%s'\n" "$ADMIN_HASH"
            printf 'NODE_AGENT_IMAGE=%s\n' 'ghcr.io/adojapan/ci-node-agent@sha256:1111111111111111111111111111111111111111111111111111111111111111'
          } > .env.ci
          chmod 0600 .env.ci

      - name: Format
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Typecheck
        run: uv run --locked mypy app bootstrap_worker node_agent relay_agent scripts

      - name: Tests
        run: uv run --locked pytest

      - name: Relay runtime credential ownership
        run: sudo python3 deploy/moblin-relay/test-render-config.py

      - name: Relay history Linux isolation
        run: sudo python3 -B -m scripts.check_relay_history_linux

      - name: Relay runtime systemd ownership
        shell: bash
        run: |
          if [ -d /run/systemd/system ] && command -v systemd-run >/dev/null 2>&1; then
            sudo python3 scripts/check_relay_runtime_systemd.py \
              --normalizer "$PWD/deploy/moblin-relay/moblin-relay-normalize"
          else
            printf '%s\n' 'Systemd runtime ownership: SKIP (systemd unavailable)'
          fi

      - name: Repository safety policy
        run: uv run --locked python scripts/check_repository.py

      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/preview-player.js
          node --check app/static/relay-dashboard.js
          node --check app/static/servers.js
          node --check app/static/moblin-hud-admin.js
          node --check app/static/moblin-hud.js

      - name: JavaScript tests
        run: node --test tests/frontend/preview-player.test.js tests/frontend/relay-dashboard.test.js tests/frontend/servers.test.js tests/frontend/moblin-hud.test.js tests/frontend/moblin-hud-admin.test.js

      - name: Shell syntax
        shell: bash
        run: |
          for file in \
            scripts/*.sh \
            deploy/hk-relay-agent/*.sh \
            ci/rpm-fixture/* \
            ci/ssh-target/fake-*; do
            sh -n "$file"
          done

      - name: Whitespace check
        run: git diff --check

      - name: Compose configurations
        shell: bash
        run: |
          set -o pipefail
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml config --quiet
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml config --quiet
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml config --format json \
            | uv run --locked python scripts/validate_production_compose.py
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml config --quiet
          uv run --locked python scripts/render_ci_node_compose.py \
            | docker compose -p adojapan-restream-node-ci -f - config --quiet

      - name: Build images
        run: docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml build

      - name: Container health smoke
        run: |
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml up -d --wait --wait-timeout 90
          curl --fail --silent http://127.0.0.1:8088/health/live
          curl --fail --silent http://127.0.0.1:8088/health/ready

      - name: Effective runtime limits
        run: sh scripts/check_runtime_limits.sh

      - name: Native fixture media clock under scheduler jitter
        shell: bash
        run: |
          # /tmp is tmpfs: Docker's archive/cp path cannot stage its live mount.
          # Write through exec and verify the exact bytes inside the container.
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml \
            exec -T ci-ssh-target python3 -c \
            'import pathlib,sys; data=sys.stdin.buffer.read(); target=pathlib.Path("/tmp/adojapan-ci-clock-self-test.py"); target.write_bytes(data); target.chmod(0o600); assert data and target.read_bytes() == data' \
            < deploy/moblin-relay/self-test
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml \
            exec -T -e CI_NATIVE_FEEDER_CLOCK=isolated-fixture ci-ssh-target \
            python3 - < deploy/moblin-relay/test-native-feeder-media.py

      - name: Strict sink decoded-frame minimum
        shell: bash
        run: |
          # Use the exact self-test staged by the preceding clock gate.
          # Finite local media proves clean EOF cannot satisfy a short capture.
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml \
            exec -T -e CI_NATIVE_SHORT_EOF=isolated-fixture ci-ssh-target \
            python3 - < deploy/moblin-relay/test-native-short-eof.py

      - name: Real RTMP rotation and output end-to-end smoke
        run: uv run --locked python scripts/ci_output_smoke.py

      - name: Post-preview runtime limits
        run: sh scripts/check_runtime_limits.sh

      - name: SSH bootstrap and native Moblin Relay end-to-end smoke
        id: native_onboarding
        run: uv run --locked python scripts/ci_node_onboarding_smoke.py

      - name: Strict native reader clock counterfactual
        # Collect independent media evidence even when native self-test failed.
        # The preceding failure remains fatal; this is not a retry or fallback.
        if: ${{ !cancelled() && (success() || steps.native_onboarding.outcome == 'failure') }}
        shell: bash
        run: |
          # Use the verified CI-image artifact, independent of install rollback.
          # Stage source through stdin because /tmp is a live tmpfs mount.
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml \
            exec -T ci-ssh-target python3 -c \
            'import pathlib,sys; data=sys.stdin.buffer.read(); target=pathlib.Path("/tmp/adojapan-ci-clock-helper.py"); target.write_bytes(data); target.chmod(0o600); assert data and target.read_bytes() == data' \
            < deploy/moblin-relay/test-native-feeder-media.py
          docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml \
            exec -T -e CI_NATIVE_READER_CLOCK=isolated-fixture ci-ssh-target \
            python3 - < deploy/moblin-relay/test-native-reader-clock.py

      - name: Post-onboarding runtime limits
        run: sh scripts/check_runtime_limits.sh

      - name: Safe diagnostic logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .env.ci ]; then
            set +e
            if docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml logs --tail=100 backend bootstrap 2>&1 \
              | grep -Fq 'CI_SSH_PASSWORD_MUST_NEVER_PERSIST_9F3A'; then
              echo 'Password persistence marker detected in bounded service logs'
            else
              echo 'Password persistence marker absent from bounded service logs'
            fi
            for service in backend bootstrap ci-ssh-target ci-node-agent; do
              container_id="$(docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml ps -a -q "$service")"
              if [ -n "$container_id" ]; then
                docker inspect --format '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restart={{.RestartCount}} oom={{.State.OOMKilled}}' "$container_id" || true
              fi
            done
          fi

      - name: Stop CI project
        if: always()
        run: |
          set +e
          cleanup_status=0
          if [ -f .env.ci ]; then
            docker compose -p adojapan-restream --env-file .env.ci -f compose.yml -f compose.production.yml -f compose.ci.yml down --remove-orphans --volumes
            cleanup_status=$?
          fi
          rm -f .env.ci .bootstrap-worker-secret.ci
          exit "$cleanup_status"

  native-startup-diagnostic:
    # Independent, non-acceptance evidence; failure remains fatal in this job.
    # No dependency on the long main job and no retry of its native acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DIAGNOSTIC_CONTAINER: adojapan-native-startup-${{ github.run_id }}-${{ github.run_attempt }}
      DIAGNOSTIC_IMAGE: adojapan-native-startup:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Diagnostic source identity
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Build exact native fixture image
        run: docker build --file ci/ssh-target/Dockerfile --tag "$DIAGNOSTIC_IMAGE" .

      - name: Start isolated native diagnostic container
        shell: bash
        run: |
          # Match compose.ci.yml's native CPU/memory/PID/tmpfs profile. No SSH,
          # host mounts, published ports, external network or privileged mode.
          docker run --detach --name "$DIAGNOSTIC_CONTAINER" \
            --label "adojapan.ci.native-startup=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --init --user 0:0 --network none --restart no --stop-timeout 10 \
            --cpus 1.50 --memory 1536m --pids-limit 512 \
            --tmpfs /run:size=16m,mode=0755 --tmpfs /tmp:size=256m,mode=1777 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            "$DIAGNOSTIC_IMAGE" sleep infinity
          docker exec "$DIAGNOSTIC_CONTAINER" install -d -m 0755 /run/lock
          docker inspect --format '{{json .HostConfig}}' "$DIAGNOSTIC_CONTAINER" \
            | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["NanoCpus"] == 1500000000 and c["Memory"] == 1536*1024**2 and c["PidsLimit"] == 512; assert c["NetworkMode"] == "none" and c["Privileged"] is False and not c.get("Binds") and not c.get("PortBindings") and not c.get("CapAdd"); assert c["Tmpfs"] == {"/run":"size=16m,mode=0755", "/tmp":"size=256m,mode=1777"}; print("Native startup isolated resource profile: PASS")'

      - name: Stage exact diagnostic sources
        shell: bash
        run: |
          # /tmp is a live tmpfs. Stage exact bytes via stdin, not docker cp.
          docker exec --interactive "$DIAGNOSTIC_CONTAINER" python3 -c \
            'import pathlib,sys; data=sys.stdin.buffer.read(); target=pathlib.Path("/tmp/adojapan-ci-clock-self-test.py"); target.write_bytes(data); target.chmod(0o600); assert data and target.read_bytes() == data' \
            < deploy/moblin-relay/self-test
          for name in normalizer wrapper renderer reader slate; do
            case "$name" in
              normalizer) source='deploy/moblin-relay/moblin-relay-normalize'; suffix='py' ;;
              wrapper) source='deploy/moblin-relay/test-native-startup-normalizer.py'; suffix='py' ;;
              renderer) source='deploy/moblin-relay/moblin-relay-render-config'; suffix='py' ;;
              reader) source='deploy/moblin-relay/test-native-reader-clock.py'; suffix='py' ;;
              slate) source='deploy/moblin-relay/slate.txt'; suffix='txt' ;;
              *) exit 2 ;;
            esac
            target="/tmp/adojapan-ci-startup-${name}.${suffix}"
            docker exec --interactive "$DIAGNOSTIC_CONTAINER" python3 -c \
              'import pathlib,sys; data=sys.stdin.buffer.read(); target=pathlib.Path(sys.argv[1]); target.write_bytes(data); target.chmod(0o600); assert data and target.read_bytes() == data' \
              "$target" < "$source"
          done

      - name: Post-crash first-child native startup diagnostic
        shell: bash
        run: |
          # Total diagnostic bound includes the unchanged pre-crash scenarios.
          # Per-child startup and media acceptance deadlines are not extended.
          docker exec --interactive --env CI_NATIVE_STARTUP=isolated-fixture \
            "$DIAGNOSTIC_CONTAINER" \
            timeout --signal=TERM --kill-after=15s 480s python3 - \
            < deploy/moblin-relay/test-native-startup.py

      - name: Remove exact native diagnostic container
        if: always()
        shell: bash
        run: |
          container_id="$(docker container ls --all --filter "name=^/${DIAGNOSTIC_CONTAINER}$" --format '{{.ID}}')"
          if [ -n "$container_id" ]; then
            test "$(docker inspect --format '{{index .Config.Labels "adojapan.ci.native-startup"}}' "$container_id")" = "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker container rm --force "$container_id"
          fi
          test -z "$(docker container ls --all --filter "name=^/${DIAGNOSTIC_CONTAINER}$" --format '{{.ID}}')"
          printf '%s\n' 'Native startup diagnostic container cleanup: PASS'
