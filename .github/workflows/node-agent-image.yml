name: Node Agent image

"on":
  workflow_dispatch:
  push:
    tags:
      - "node-v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate deterministic image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/andreykutenkikh-byte/restream-node
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=AdoJapan Restream Node Agent
            org.opencontainers.image.description=Outbound-only agent for AdoJapan Restream nodes
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      - name: Build and publish Node Agent image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.node
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Report immutable image digest
        env:
          IMAGE: ghcr.io/andreykutenkikh-byte/restream-node
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -eu
          test -n "$DIGEST"
          printf 'Published Node Agent image: %s@%s\n' "$IMAGE" "$DIGEST"

  verify-anonymous-pull:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: none
    steps:
      - name: Check out verifier only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify anonymous exact-digest pull
        env:
          IMAGE_REFERENCE: ghcr.io/andreykutenkikh-byte/restream-node@${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -eu
          sh scripts/verify_node_agent_image_pull.sh "$IMAGE_REFERENCE"
          {
            echo '### Verified public Node Agent image'
            echo
            printf '`%s`\n' "$IMAGE_REFERENCE"
            echo
            echo 'Anonymous pull of the exact digest: passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain public-package requirement
        if: failure()
        shell: bash
        run: |
          echo 'Anonymous exact-digest pull failed.'
          echo 'If this is the first release, the package owner must set restream-node visibility to public and rerun this workflow.'
          exit 1
