services:
  backend:
    environment:
      ENVIRONMENT: test
      COOKIE_SECURE: "false"
      TEST_DESTINATION_ALLOWLIST: rtmp://ci-rtmp-receiver:1935/ci-output
    depends_on:
      ci-rtmp-receiver:
        condition: service_healthy

  ci-rtmp-receiver:
    image: bluenviron/mediamtx:1.19.2
    command: ["/ci-receiver.yml"]
    volumes:
      - ./mediamtx/ci-receiver.yml:/ci-receiver.yml:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "0.15"
    mem_limit: 128m
    pids_limit: 32
    stop_grace_period: 10s
    restart: "no"
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
